# /etc/wachposten/daemon.toml – all keys are optional; these are the defaults.

# Members of these groups may decide on system-wide events. Everybody sees them.
admin_groups = ["wheel", "sudo", "admin"]

[exec]
# Watch program starts from /tmp, /var/tmp, /dev/shm, /run/user and ~/.cache.
enabled = true
# Refuse to start known malware (YARA-X or hash hit) from tmpfs folders.
block_known_malware = true
# "suspicious": hits, hidden names, /dev/shm, names of system processes
# "always": every program not allowed before; "malware": hits only
popup = "suspicious"
# Time a held-up start may spend in the scan before it is allowed anyway.
scan_budget_ms = 1500
history_days = 30

[yara]
enabled = true
extra_rule_dirs = []

[hashes]
# malwarebazaar_auth_key = "..."   # from https://auth.abuse.ch/, non-commercial use only
update_hours = 6
online_lookup = false

[clamav]
# Use a running clamd for Windows programs, Office files, PDFs and archives (not while a start
# is held up). The socket is found in the usual places unless given.
enabled = true
# socket = "/run/clamd.scan/clamd.sock"
max_scan_mb = 100

[ransomware]
# Needs the eBPF part. A process that changes this many files in home folders within the
# window has the files it wrote last checked; if they look encrypted, it is stopped.
enabled = true
files = 25
window_secs = 20
# "stop": stop it (SIGSTOP) until someone decides; "report": only ask.
action = "stop"
# Programs or scripts that are never stopped, such as a backup tool.
ignore = []
