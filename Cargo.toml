[workspace]
resolver = "3"
members = ["crates/core", "crates/watch", "crates/scan", "crates/daemon", "crates/agent", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
wachposten-core = { path = "crates/core" }
wachposten-watch = { path = "crates/watch" }
wachposten-scan = { path = "crates/scan" }
anyhow = "1"
thiserror = "2"
inotify = "0.11"
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4.19"
rusqlite = { version = "0.41", features = ["bundled"] }
similar = "3"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
regex = "1"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
libc = "0.2"
# yara-x 1.23 needs rsa 0.10.0-rc.19; newer release candidates break its build (pinned in Cargo.lock).
yara-x = "1.23"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
nix = { version = "0.31", features = ["poll", "fanotify", "user", "socket", "signal", "fs", "process"] }

[workspace.lints.rust]
# deny, not forbid: code generated by Slint allows unsafe locally; our own code may not.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
